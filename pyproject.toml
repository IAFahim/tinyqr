[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyqr"
version = "0.1.0"
description = "Zero-dependency pure-Python ISO/IEC 18004 QR code encoder (Versions 1-6, ECC M/H) with PNG, SVG, and ASCII renderers."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
